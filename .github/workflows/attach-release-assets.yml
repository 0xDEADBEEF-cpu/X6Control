name: Attach assets to v1.0.0 release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release version
        run: test "$(tr -d '[:space:]' < VERSION)" = "1.0.0"

      - name: Build universal macOS app
        run: bash scripts/build-macos.sh universal

      - name: Package release files
        run: bash scripts/package-macos-release.sh 1.0.0

      - name: Upload files to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload v1.0.0
          dist/X6-Control-macOS-universal-v1.0.0.zip
          dist/X6-Control-macOS-universal-v1.0.0.dmg
          dist/SHA256SUMS
          --clobber
