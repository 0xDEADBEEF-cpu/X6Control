name: macOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check release version
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"

      - name: Build universal macOS app
        run: scripts/build-macos.sh universal

      - name: Package release files
        run: scripts/package-macos-release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/X6-Control-macOS-universal-v${GITHUB_REF_NAME#v}.zip"
          "dist/X6-Control-macOS-universal-v${GITHUB_REF_NAME#v}.dmg"
          dist/SHA256SUMS
          --verify-tag
          --title "X6 Control ${GITHUB_REF_NAME#v}"
          --generate-notes
